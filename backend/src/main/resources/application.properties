spring.application.name=video-compressor-backend

# Local secrets/config live in a .env file next to the backend or at repo root (never committed)
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ---------- storage ----------
app.data-dir=${APP_DATA_DIR:./data}
app.retention-hours=${APP_RETENTION_HOURS:24}

# ---------- database (SQLite) ----------
spring.datasource.url=jdbc:sqlite:${app.data-dir}/app.db?journal_mode=WAL&busy_timeout=10000&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer; a single pooled connection serialises access instead of failing with SQLITE_BUSY
# (WAL read->write upgrades fail immediately, regardless of busy_timeout). Ample for the demo's scale.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=30000
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# schema: versioned Flyway migrations per database (db/migration/sqlite | db/migration/postgresql).
# Baseline 0 + idempotent V1 also upgrades databases created by the former schema.sql.
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---------- upload ----------
spring.servlet.multipart.max-file-size=${APP_MAX_UPLOAD_MB:2048}MB
spring.servlet.multipart.max-request-size=${APP_MAX_UPLOAD_MB:2048}MB
spring.servlet.multipart.file-size-threshold=1MB
spring.servlet.multipart.location=${app.data-dir}/tmp

# ---------- external tools (bare names are resolved from PATH + common install dirs) ----------
app.tools.ffmpeg=${FFMPEG_PATH:ffmpeg}
app.tools.ffprobe=${FFPROBE_PATH:ffprobe}
app.tools.exiftool=${EXIFTOOL_PATH:exiftool}
app.tools.magick=${MAGICK_PATH:magick}
app.tools.rembg=${REMBG_PATH:}
app.tools.conda=${CONDA_PATH:}
app.tools.rembg-env=${REMBG_ENV:rembg-env}
app.tools.ghostscript=${GHOSTSCRIPT_PATH:}
# rembg's newest default model is ~1 GB and can exhaust memory; u2net (~170 MB) is the proven general model
app.tools.rembg-model=${REMBG_MODEL:u2net}
# Document Studio: LibreOffice (soffice.com) and a Chromium-family browser (Chrome / Edge) for HTML -> PDF
app.tools.soffice=${SOFFICE_PATH:}
app.tools.chromium=${CHROMIUM_PATH:}
# Learning player OCR: a Python with RapidOCR installed (empty = auto-detect D:/LumenTools/ocr-venv, ...)
app.tools.ocr-python=${OCR_PYTHON:}

# ---------- learning player ----------
# speech recognition: Alibaba Cloud Model Studio (DashScope) Paraformer; the key never reaches the frontend
app.asr.api-key=${DASHSCOPE_API_KEY:}
app.asr.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
app.asr.model=${DASHSCOPE_ASR_MODEL:paraformer-v2}
app.lesson.keyframe-interval-sec=${LESSON_KEYFRAME_INTERVAL_SEC:3}
app.lesson.max-duration-min=${LESSON_MAX_DURATION_MIN:120}

# ---------- media task engine ----------
app.media.max-concurrent=${APP_MEDIA_CONCURRENCY:2}
app.media.queue-capacity=${APP_MEDIA_QUEUE:50}
app.media.per-user-active-limit=${APP_USER_ACTIVE_LIMIT:4}
app.media.ffmpeg-threads=${APP_FFMPEG_THREADS:0}
app.media.task-timeout-minutes=${APP_TASK_TIMEOUT_MIN:60}
app.media.min-free-disk-mb=${APP_MIN_FREE_DISK_MB:1024}

# ---------- security ----------
# If empty, a random secret is generated at startup (logins are invalidated on restart)
app.security.jwt-secret=${APP_JWT_SECRET:}
app.security.jwt-ttl-hours=${APP_JWT_TTL_HOURS:72}
app.security.allow-registration=${APP_ALLOW_REGISTRATION:true}
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---------- AI (DeepSeek, proxied by backend; key is NEVER sent to the browser) ----------
app.ai.api-key=${DEEPSEEK_API_KEY:}
app.ai.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
app.ai.model=${DEEPSEEK_MODEL:deepseek-flash}
app.ai.proxy=${DEEPSEEK_PROXY:}

# ---------- built frontend served by the backend (one process, one URL) ----------
app.frontend-dist=${APP_FRONTEND_DIST:./frontend/dist}

# ---------- ops ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
springdoc.swagger-ui.path=/swagger-ui.html
logging.pattern.level=%5p [task:%X{taskId:-}]
logging.level.com.houqing.tools=INFO
