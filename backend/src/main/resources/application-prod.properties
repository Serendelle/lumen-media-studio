# ---------------------------------------------------------------------------
# Production profile (multi-user / public deployment): PostgreSQL 16+.
# Activate with SPRING_PROFILES_ACTIVE=prod. SQLite (application.properties) stays for local single-machine use.
# No credential has a default here: the service refuses to start until they are provided.
# ---------------------------------------------------------------------------
spring.datasource.url=${LUMEN_DB_URL}
spring.datasource.username=${LUMEN_DB_USER}
spring.datasource.password=${LUMEN_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${LUMEN_DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# required in production: a random per-start secret (the local fallback) would log everyone out on every restart
app.security.jwt-secret=${APP_JWT_SECRET}

# migrations run on start-up; a production database is never "baselined" over an unknown schema
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
