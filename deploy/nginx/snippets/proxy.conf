# Docker may assign a new IP after recreating api. Resolve the service again.
set $lumen_api http://api:8080;
proxy_pass $lumen_api;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Replace a client's untrusted forwarded headers at the public boundary.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_set_header Authorization $http_authorization;
proxy_set_header X-Participant-Token $http_x_participant_token;
proxy_set_header Last-Event-ID $http_last_event_id;
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_connect_timeout 10s;
# Do not replay a non-idempotent upload/mutation after an upstream failure.
proxy_next_upstream off;
add_header X-Accel-Buffering no always;
add_header Cache-Control "no-store" always;
include /etc/nginx/snippets/headers.conf;
# Nginx error messages may contain a credential in the request URI. Backend logs
# and the redacted access log remain available without recording those URIs.
error_log /dev/null;
