worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Omit URI, query, referrer and all credentials, including collection tokens.
    log_format safe '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    map $scheme $lumen_hsts {
        default "";
        https "max-age=15552000";
    }
    map $request_method $anonymous_write_key {
        default "";
        POST $binary_remote_addr;
        PUT $binary_remote_addr;
        PATCH $binary_remote_addr;
        DELETE $binary_remote_addr;
    }
    limit_req_zone $anonymous_write_key zone=anonymous_writes:10m rate=60r/m;
    limit_req_status 429;
    include /etc/nginx/conf.d/*.conf;
}
